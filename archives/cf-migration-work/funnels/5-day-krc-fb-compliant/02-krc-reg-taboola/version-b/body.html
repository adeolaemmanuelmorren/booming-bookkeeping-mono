<script>
$(document).ready(function() {
  $(document).find('[data-title="faq-accord-question"] > h1').css({ 'cursor': 'pointer' })
    var accordQuest = $(document).find(
        '[data-title="faq-accord-question"] > h1'
    );
    var accordAns = $(document).find('[data-title="faq-accord-answer"]');
    var fontColorBase = accordQuest.css('color');

    accordQuest.each(function() {
        $(this).css({ 'text-align': 'left', padding: '15px' });
        $(this).after(
            '<i style="cursor:pointer;color:' +
                fontColorBase +
                ';position: absolute;top: 50%;-webkit-transform: translateY(-50%);-ms-transform: translateY(-50%);transform: translateY(-50%); left: -5px; color: #e62029; }" class="fa_prepended fa fa-plus" contenteditable="false"></i>'
        );
        $(this).click(function() {
            if ($(this).parent().find('i').hasClass('fas fa-times')) {
                $(this).parent().find('i').removeClass('fas fa-times').addClass('fa-plus');
            } else {
                $(this).parent().find('i').removeClass('fa-plus').addClass('fas fa-times');
            }
            $(this)
                .parent()
                .nextUntil('[data-title="faq-accord-question"]')
                .slideToggle();
        });
    });
    var accordBut = $(document).find('[data-title="faq-accord-question"] > i');
    accordBut.each(function() {
        $(this).click(function() {
            if ($(this).hasClass('fa-minus')) {
                $(this).removeClass('fa-minus').addClass('fa-plus');
            } else {
                $(this).removeClass('fa-plus').addClass('fa-minus');
            }
            $(this)
                .parent()
                .nextUntil('[data-title="faq-accord-question"]')
                .slideToggle();
    });
    });
    accordAns.each(function() {
        $(this).css({ 'text-align': 'left', padding: '15px' });
    });
  accordAns.slideUp();
  // accordBut.eq(0).click()
});
</script>

<script type="text/javascript">
$(function () {
const IPinfoToken = 'f6106ad2dcab3d';

const itiIstances = [];
let validate;
// Add Zapier hidden input filed
$('#cfAR').append('<input type="hidden" id="intl-phone">');
const zapierPhoneData = $('#intl-phone');

// The phoneNumberInput automatically finds the form "submit" button
const submitButton = $('a[href="#submit-form"]');

// The phoneNumberInput automatically finds the phone input filed
const phoneNumberInputs = $("input[name='phone']");

//Add the validation message after the phoneNumberInput
phoneNumberInputs.after('<div class="phone-status hide"></div>');
const phoneStatus = $('.phone-status');

phoneNumberInputs.each(function () {
// const phoneNumberInput =⁄ phoneNumberInputs.eq(el);
const phoneNumberInput = $(this);

// Initialize intlTelInput
const iti = window.intlTelInput(phoneNumberInput[0], {
initialCountry: 'auto',
nationalMode: false, // da lasciare
utilsScript:
'https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js?1603274336113',
geoIpLookup: function (success, failure) {
$.get(
IPinfoToken
? 'https://ipinfo.io?token=' + IPinfoToken
: 'https://ipinfo.io',
function () {},
'jsonp'
).always(function (resp) {
var countryCode = resp && resp.country ? resp.country : 'us';
success(countryCode);
});
},
});

itiIstances.push(iti);

function validatePhone() {
// intlTelInput validation error
const errorMap = [
'Invalid number',
'Invalid country code',
'Too short',
'Too long',
'Invalid number',
];

resetPhoneState();
if (phoneNumberInput.val().trim()) {
if (iti.isValidNumber()) {
phoneNumberInputs
.removeClass('invalid-phone')
.addClass('valid-phone');

phoneStatus.html('✓ Valid').removeClass('hide');

submitButton.removeClass('disabled-button');
zapierPhoneData.val(iti.getNumber());
} else {
phoneNumberInputs
.removeClass('valid-phone')
.addClass('invalid-phone');

phoneStatus
.removeClass('hide')
.html(errorMap[iti.getValidationError()]);

submitButton.addClass('disabled-button');
}
}
}

validate = validatePhone;

// Validate the phone number on keyup and change
phoneNumberInput.on('keyup change', validatePhone);

phoneNumberInput.on('countrychange', function () {
itiIstances.forEach(function (el) {
const iso = iti.getSelectedCountryData().iso2;
if (iso) {
el.setCountry(iso);
validatePhone();
}
});
});

// Reset the phone state messages and sets the phone number with intlTelInput
let firstLoad = true;
function resetPhoneState() {
phoneNumberInputs.removeClass('error');
$('.phone-status').addClass('hide').html('');
if (firstLoad === true) {
iti.setNumber($('#cf_contact_phone').val());
firstLoad = false;
} else {
iti.setNumber(iti.getNumber());
}
}
resetPhoneState();
});

itiIstances[0].promise.then(function () {
validate();
});
});
</script>

<!-- Complete Free Registration - Reliable & Clean Version -->
<script>
  const waitForPopup = setInterval(() => {
    const emailInput = document.querySelector('input[name="email"]');
    const phoneInput = document.querySelector('input[name="phone"]');
    const firstNameInput = document.querySelector('input[name="first_name"]');
    const submitLink = document.querySelector('a[href="#submit-form"]');

    if (emailInput && phoneInput && firstNameInput && submitLink) {
      console.log("✅ Input fields + submit button");

      submitLink.addEventListener('click', async (e) => {
        e.preventDefault(); // Stop immediate redirect

        // Wait for autofill or bindings
        setTimeout(async () => {
          const emailRaw = emailInput.value || '';
          const phoneRaw = phoneInput.value || '';
          const firstNameRaw = firstNameInput.value || '';

          const email = emailRaw.trim().toLowerCase();
          const phone = phoneRaw.trim().replace(/[^0-9+]/g, '');
          const firstName = firstNameRaw.trim().toLowerCase();
          const eventId = 'cf_free_' + Date.now();

          // Read Facebook cookies
          function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
          }
          const fbp = getCookie('_fbp') || '';
          const fbc = getCookie('_fbc') || '';
          const userAgent = navigator.userAgent;

          // Warn if any important field is missing
          if (!email || !phone || !firstName) {
            console.warn("⚠️ Missing input(s):", { email, phone, firstName });
          }

          // Hash function (SHA-256)
          async function sha256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer))
              .map(b => b.toString(16).padStart(2, '0'))
              .join('');
          }

          // Hash data conditionally
          const em_hashed = email ? await sha256(email) : null;
          const ph_hashed = phone ? await sha256(phone) : null;
          const fn_hashed = firstName ? await sha256(firstName) : null;

          // 🔥 Fire browser-side Pixel
          if (typeof fbq === 'function') {
            fbq('trackCustom', 'Complete Free Registration', {
              content_name: 'Free BBB Challenge',
              value: 0.00,
              currency: 'USD',
              eventID: eventId
            });
          }

          // 🔥 Fire server-side CAPI event to Stape
          fetch('https://events.thebookkeepingchallenge.com', {
            method: 'POST',
            keepalive: true,
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              event_name: 'Complete Free Registration',
              event_time: Math.floor(Date.now() / 1000),
              event_id: eventId,
              action_source: 'website',
              user_data: {
                ...(em_hashed && { em: em_hashed }),
                ...(ph_hashed && { ph: ph_hashed }),
                ...(fn_hashed && { fn: fn_hashed }),
                fbp,
                fbc,
                client_user_agent: userAgent
                // IP is auto-collected by Stape server
              },
              custom_data: {
                content_name: 'Free BBB Challenge',
                value: 0.00,
                currency: 'USD'
              }
            })
          });

          console.log("✅ Meta Pixel + Stape Event Sent:", {
            em_hashed,
            ph_hashed,
            fn_hashed,
            fbp,
            fbc,
            userAgent,
            eventId
          });
        }, 300);
      });

      clearInterval(waitForPopup);
    }
  }, 500);
</script>
